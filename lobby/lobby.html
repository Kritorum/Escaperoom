<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Der Hausmeister</title>
  <link rel="stylesheet" href="lobbyStyle.css">
 
  <script>
    function showSection(section) {
      document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
      document.getElementById(section).classList.remove('hidden');
    }
  </script>

</head>
<body>
  <header>
    Der Hausmeister
  </header>
 
  <div class="container">
    <div class="sidebar">
      <button onclick="showSection('story')">Story</button>
      <button onclick="showSection('aufgaben')">Rätsel</button>
      <button onclick="showSection('hilfe')">Hilfe</button>
    </div>
 
    <div class="main-content">
      <div id="story" class="section">
        <div class="section-title">Aktuelle Story</div>
        <div class="story-content">
          <div class="story-text">Absoluter Beispieltext...</div>
        </div>
      </div>
 
      <div id="aufgaben" class="section hidden">
        <div class="container-grid">
          <div class="box" style="background-image: url('\bilder\rätsel1-binär');">
            <h2 class="box-title">Rätsel 1</h2>
          </div>
          <div class="box" style="background-image: url('#');">
            <h2 class="box-title">Rätsel 2</h2>
          </div>
          <div class="box" style="background-image: url('#');">
            <h2 class="box-title">Rätsel 3</h2>
          </div>
          <div class="box" style="background-image: url('#');">
            <h2 class="box-title">Rätsel 4</h2>
          </div>
          <div class="box" style="background-image: url('#');">
            <h2 class="box-title">Rätsel 5</h2>
          </div>
          <div class="box" style="background-image: url('#');">
            <h2 class="box-title">Rätsel 6</h2>
          </div>
          <div class="box" style="background-image: url('#');">
            <h2 class="box-title">Rätsel 7</h2>
          </div>
          <div class="box" style="background-image: url('#');">
            <h2 class="box-title">Rätsel 8</h2>
          </div>
        </div>
      </div>
 
      <div id="hilfe" class="section hidden">
        <div class="section-title">Hilfe</div>
        <p>Hier können Sie Hilfestellungen und Tipps erhalten.</p>
      </div>
    </div>
  </div>
</body>
</html>
