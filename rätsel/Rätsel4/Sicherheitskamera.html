<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sicherheitskamera deaktivieren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="Sicherheitskamera.css">
</head>
<body>

    <h1>Sicherheitskamera deaktivieren</h1>
    <div class="story">
        <p>Eine Sicherheitskamera überwacht den Flur. Um unbemerkt zu passieren, musst du sie hacken und ausschalten. Spiele mit den Einstellungen des Systems und finde die richtige Kombination!</p>
    </div>

    <div class="puzzle-container">
        <svg id="cameraIcon" class="camera-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M0 5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 1.983 1.738l3.11-1.382A1 1 0 0 1 16 4.269v7.462a1 1 0 0 1-1.406.913l-3.111-1.382A2 2 0 0 1 9.5 13H2a2 2 0 0 1-2-2zm11.5 5.175 3.5 1.556V4.269l-3.5 1.556zM2 4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h7.5a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/>
        </svg>
        
        <div class="input-container">
            <label class="input-label" for="cameraInput">Kamera:</label>
            <input type="text" id="cameraInput" class="input-field" placeholder="/true">
        </div>
        <div class="input-container">
            <label class="input-label" for="motionDetectionInput">Bewegungserkennung:</label>
            <input type="text" id="motionDetectionInput" class="input-field" placeholder="/true">
        </div>
        <div class="input-container">
            <label class="input-label" for="nightVisionInput">Nachtsichtmodus:</label>
            <input type="text" id="nightVisionInput" class="input-field" placeholder="/true">
        </div>

        <button onclick="checkCamera()">Überprüfen</button>
        <div class="message" id="message"></div>
    </div>

    <div class="inventory">
        <span class="inventory-item" id="inventory">Inventar: </span>
    </div>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeButton" onclick="closeModal()">&times;</span>
            <div id="resultMessage" class="result"></div>
            <div class="separator"></div> <!-- Trennstrich für das Ergebnis -->
            <p id="modalMessage"></p>
            <div class="separator" id="separator" style="display: none;"></div> <!-- Nur für falsches Ergebnis -->
            <div class="button-container">
                <button id="backButton" style="display: none;" onclick="goBack()">Weiter</button>
            </div>
        </div>
    </div>

    <script src="Sicherheitskamera.js"></script>

</body>
</html>
