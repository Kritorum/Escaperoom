<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netzwerkzugang zum Serverraum</title>
    <link rel="stylesheet" href="Netzwerkzugang.css">
</head>
<body>

    <h1>Netzwerkzugang zum Serverraum</h1>
    <div class="story">
        <p>Du musst in den Serverraum, um das Sicherheitssystem zu manipulieren. Doch der Zugang ist durch eine Netzwerkkonfiguration gesichert. Finde die korrekte Netzmaske, um dich in das Netzwerk einzuloggen!</p>
    </div>

    <div class="puzzle-container">
        <p>Terminal: <strong>192.168.1.10</strong></p>
        <input type="text" id="subnetMask" placeholder="Netzmaske">
        <button onclick="checkSubnetMask()">Überprüfen</button>
        <div class="message" id="message"></div>
    </div>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeButton" onclick="closeModal()">&times;</span>
            <div id="resultMessage" class="result"></div>
            <div class="separator"></div>
            <p id="modalMessage"></p>
            <div class="separator" id="separator" style="display: none;"></div> <!-- Nur für falsches Ergebnis -->
            <div class="button-container">
                <button id="backButton" style="display: none;" onclick="goBack()">Weiter</button>
            </div>
        </div>
    </div>

    <script src="Netzwerkzugang.js"></script>

</body>
</html>
